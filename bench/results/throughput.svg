<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 542" width="760" height="542" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="Monolith throughput by scenario">
<style>:root{--fg:#111827;--mute:#6b7280;--grid:#e5e7eb;--bg:#ffffff;--a:#D90F23;--b:#6b7280;--c:#111827}@media (prefers-color-scheme:dark){:root{--fg:#e5e7eb;--mute:#9ca3af;--grid:#1f2430;--bg:#0B0D12;--a:#FF4D55;--b:#9ca3af;--c:#e5e7eb}}text{fill:var(--fg)} .m{fill:var(--mute)}</style>
