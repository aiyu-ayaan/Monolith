[workspace]
resolver = "3"
members = [
    "crates/monolith-store",
    "crates/monolith-rules",
    "crates/monolith-auth",
    "crates/monolith-core",
    "crates/monolith-server",
    "bench/harness",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
monolith-store = { path = "crates/monolith-store" }
monolith-rules = { path = "crates/monolith-rules" }
monolith-auth = { path = "crates/monolith-auth" }
monolith-core = { path = "crates/monolith-core" }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
crossbeam-channel = "0.5"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
criterion = { version = "0.8", features = ["async_tokio"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
argon2 = "0.5"
hmac = "0.13"
sha2 = "0.11"
blake3 = "1"
infer = "0.19"
getrandom = "0.3"
axum = "0.8"
tower = "0.5"
rust-embed = { version = "8", features = ["mime-guess"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7"
futures-core = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Doc 16 §2 Build: unwinding stays on, the writer restart and panic catching need it.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
