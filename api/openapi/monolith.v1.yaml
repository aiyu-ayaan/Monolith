openapi: 3.1.0
info:
  title: Monolith API
  version: 1.0.0-draft
  description: |
    Static part of the Monolith REST contract (development/docs/11-api-and-openapi.md).
    Covers Phase 1: superuser auth, apps, collections and records. Per-app typed
    record schemas are served at runtime from /api/v1/apps/{app}/openapi.json (Phase 4).

    Conventions:
    - Ids are UUIDv7 as 26-char lowercase Crockford base32.
    - Dates are RFC 3339 UTC strings with microsecond precision on the wire.
    - Errors are RFC 9457 application/problem+json (api/jsonschema/error.json).
    - Every response carries X-Request-Id (a valid client value is echoed).
servers:
  - url: http://localhost:8090
security:
  - bearerAuth: []

paths:
  /api/v1/system/health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /api/v1/system/auth/login:
    post:
      operationId: superuserLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: Signed superuser token
          content:
            application/json:
              schema:
                type: object
                required: [token, expires]
                properties:
                  token: { type: string }
                  expires: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/system/install:
    get:
      operationId: installStatus
      security: []
      description: Whether the server still needs its first superuser.
      responses:
        "200":
          description: Install state
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: { type: boolean }
    post:
      operationId: install
      security: []
      description: >
        Creates the first superuser. Needs the one-time installer token the server prints
        on start-up while no superuser exists (memory only, expires after 1 h, consumed on
        success). Any token is rejected once a superuser exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        "201":
          description: Superuser created; signed superuser token
          content:
            application/json:
              schema:
                type: object
                required: [token, expires]
                properties:
                  token: { type: string }
                  expires: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/system/me:
    get:
      operationId: getMe
      description: The signed-in superuser. A removed superuser's token gets 401.
      responses:
        "200":
          description: Current superuser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Superuser" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/system/superusers:
    get:
      operationId: listSuperusers
      description: All console superusers, oldest first.
      responses:
        "200":
          description: Superusers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Superuser" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSuperuser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: { $ref: "#/components/schemas/Id" }
                  email: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/system/superusers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    delete:
      operationId: deleteSuperuser
      description: >-
        Removes a superuser. 409 when removing yourself or the last superuser.
        Tokens are not revoked; the removed superuser's token works until it expires (1 h).
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/system/apps:
    get:
      operationId: listApps
      responses:
        "200":
          description: All apps
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/Name" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/system/apps/{app}:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: getApp
      responses:
        "200":
          description: The app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteApp
      description: Closes the app and deletes its data directory. Irreversible.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/collections:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listCollections
      responses:
        "200":
          description: Collection definitions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Collection" }
    post:
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/collections/{collection}:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Collection"
    get:
      operationId: getCollection
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: replaceCollection
      description: |
        Replaces the definition; the server plans and applies the migration
        (add/drop fields, indexes, rules). Field type changes are rejected until the
        online table rebuild lands.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCollection
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/collections/{collection}/records:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Collection"
    get:
      operationId: listRecords
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema: { type: string, maxLength: 4096 }
          description: Rules language, e.g. `status = 'open' && created > '2026-01-01'`
        - name: sort
          in: query
          schema: { type: string }
          description: Comma-separated fields, `-` prefix for descending. `id` is always the final tie-breaker.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque `next` value from the previous page. Must be used with the same filter and sort.
        - name: fields
          in: query
          schema: { type: string }
          description: Comma-separated top-level fields to return. `id` is always returned.
        - name: expand
          in: query
          schema: { type: string }
          description: Comma-separated relation paths (up to 4 hops, e.g. `author,parent.author`).
        - name: total
          in: query
          schema: { type: string, enum: [none, exact, estimate], default: none }
          description: Opt-in count (`none` omits `total`, `exact` runs `COUNT(*)`, `estimate` uses table stats when unfiltered).
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Record" }
                  next:
                    type: [string, "null"]
                    description: Cursor for the next page; null on the last page
                  total:
                    type: [integer, "null"]
                    description: Present when `total=exact` or `total=estimate`
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRecord
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - name: expand
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
              description: Quoted record version `_v`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/collections/{collection}/records:count:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Collection"
    get:
      operationId: countRecords
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: total
          in: query
          schema: { type: string, enum: [exact, estimate], default: exact }
      responses:
        "200":
          description: Record count
          content:
            application/json:
              schema:
                type: object
                required: [total, exact]
                properties:
                  total: { type: integer }
                  exact: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/collections/{collection}/records/{id}:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Collection"
      - name: id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      operationId: getRecord
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: expand
          in: query
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
          description: Record version `_v` (quoted or unquoted); returns 304 when unchanged
      responses:
        "200":
          description: The record
          headers:
            ETag:
              schema: { type: string }
              description: Quoted record version `_v`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "304":
          description: Not modified
        "404":
          description: Missing, or hidden by the view rule (same response, so existence does not leak)
          content:
            application/problem+json:
              schema: { $ref: "../jsonschema/error.json" }
    patch:
      operationId: updateRecord
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - name: expand
          in: query
          schema: { type: string }
        - name: If-Match
          in: header
          schema: { type: string }
          description: Expected `_v` for optimistic concurrency; mismatches return 412
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    put:
      operationId: upsertRecord
      security: [{}, { bearerAuth: [] }]
      description: Updates the record if it exists (checked by update rule, 200), otherwise creates it with this id (checked by create rule, 201).
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - name: expand
          in: query
          schema: { type: string }
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: Updated existing record
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "201":
          description: Created new record
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRecord
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - name: If-Match
          in: header
          schema: { type: string }
          description: Expected `_v` for optimistic concurrency; mismatches return 412
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/batch:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: batch
      security: [{}, { bearerAuth: [] }]
      description: All operations commit atomically or none do. At most 500 operations.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  maxItems: 500
                  minItems: 1
                  items:
                    type: object
                    required: [op, collection]
                    properties:
                      op: { type: string, enum: [create, update, delete] }
                      collection: { $ref: "#/components/schemas/Name" }
                      id: { $ref: "#/components/schemas/Id" }
                      body: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/collections:diff:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: diffCollection
      description: Plans DDL statements for creating or replacing a collection without applying them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "200":
          description: Planned migration statements
          content:
            application/json:
              schema:
                type: object
                required: [statements]
                properties:
                  statements:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/rules:explain:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: explainRule
      description: Compiles a collection rule or filter expression and optionally evaluates it against a sample row and principal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection: { $ref: "#/components/schemas/Name" }
                op: { type: string, enum: [list, view, create, update, delete, filter], default: list }
                expr: { type: string, description: Override rule/filter expression; defaults to the collection rule for `op` }
                authAs:
                  type: object
                  properties:
                    id: { $ref: "#/components/schemas/Id" }
                    collection: { type: string, default: users }
                    claims: { type: object, additionalProperties: true }
                record: { type: object, additionalProperties: true, description: Sample record values for in-memory evaluation }
                body: { type: object, additionalProperties: true, description: "@request.body values for write rules" }
      responses:
        "200":
          description: Rule explanation
          content:
            application/json:
              schema:
                type: object
                required: [collection, op, expr, class, sql]
                properties:
                  collection: { type: string }
                  op: { type: string }
                  expr: { type: [string, "null"] }
                  class: { type: string, enum: [superusersOnly, const, authOnly, rowLocal, relational] }
                  sql: { type: string }
                  verdict: { type: [boolean, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/query:explain:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: explainQuery
      description: Compiles a list query and returns its SQLite EXPLAIN QUERY PLAN and index suggestions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection: { $ref: "#/components/schemas/Name" }
                filter: { type: string, default: "" }
                sort: { type: string, default: "" }
                superuser: { type: boolean, default: false }
      responses:
        "200":
          description: Query plan and index suggestions
          content:
            application/json:
              schema:
                type: object
                required: [sql, plan, usesScan, suggestedIndexes]
                properties:
                  sql: { type: string }
                  plan:
                    type: array
                    items:
                      type: object
                      required: [id, parent, detail]
                      properties:
                        id: { type: integer }
                        parent: { type: integer }
                        detail: { type: string }
                  usesScan: { type: boolean }
                  suggestedIndexes:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/logs:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listLogs
      parameters:
        - name: request_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Recent request traces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RequestLog" }

  /api/v1/apps/{app}/logs/slow:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listSlowQueries
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Slowest recent requests by duration
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RequestLog" }

  /api/v1/system/stats:
    get:
      operationId: systemStats
      description: |
        Server-wide traffic and resource stats (superuser). In-memory since `since`
        (server start); per-minute buckets for the last hour, per-hour for the last 48 h.
      responses:
        "200":
          description: Global stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStats" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/stats:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: appStats
      description: Per-app traffic, record operations, store internals, storage and per-collection counters (superuser).
      parameters:
        - name: counts
          in: query
          schema: { type: string, enum: [estimate, exact], default: estimate }
          description: "`exact` runs COUNT(*) per collection; `estimate` reads sqlite_stat1 (null when unknown)."
      responses:
        "200":
          description: App stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStats" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/realtime:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: realtime
      description: |
        Server-Sent Events stream of record changes (doc 07). Events: `hello` (`{conn, hb}`),
        `snapshot` (`{collection, seq, items, next}`, only with `snapshot=`),
        `record` (`{op: create|update|delete|leave, collection, seq, record}`, SSE `id` = seq),
        `resync` (`{reason}`: refetch), `error` (`{collection, message}`), plus `: hb` comments every `hb` seconds.
        A `record` event carries the row as it is when dispatched, so rapid writes coalesce.
        `leave` means the record stopped matching the topic's filter or the view rule (it was not deleted).
        A narrowed topic (`filter.<c>` or `ids.<c>`) remembers up to 50 000 records it showed, so it
        can send `leave` and deliver their deletes. One topic per collection per connection.
        Superusers see everything including hidden fields. Others need a non-relational view
        rule and receive only rows it allows; on untracked topics `delete` events reach them only
        when the view rule is public. A slow client (256 queued frames) is dropped and must reconnect.
        Resume with `since` or `Last-Event-ID`; a snapshot wins over `since`.
        Send the token in `Authorization`; browsers use `fetch` streaming, not `EventSource`.
      parameters:
        - name: collections
          in: query
          required: true
          schema: { type: string, example: "posts,comments" }
          description: Comma-separated collection names (1 to 32).
        - name: filter.{collection}
          in: query
          required: false
          schema: { type: string, example: "done = false" }
          description: Filter expression (doc 06, non-relational) for that collection; replace `{collection}` with its name.
        - name: ids.{collection}
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated record ids; only these records are delivered.
        - name: sort.{collection}
          in: query
          required: false
          schema: { type: string, example: "-created" }
          description: Sort of the snapshot.
        - name: snapshot
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000 }
          description: Send the current result set (at most this many records per collection) before live events.
        - name: since
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Replay changes after this seq (up to 20 000, else a `resync` event). The `Last-Event-ID` header is the same.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/backups:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listBackups
      description: Snapshot backups of the app, newest first (superuser).
      responses:
        "200":
          description: Backups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createBackup
      description: |
        Takes a consistent snapshot (`VACUUM INTO`) while the app keeps serving. Stored under
        `<data>/backups/<app>/`. Backups outlive the app.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/backups/{name}:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^b[0-9]{17}\\.db$" }
    get:
      operationId: downloadBackup
      description: Streams the snapshot, a plain SQLite database file. Storage files are not part of this download; they stay on the server in `b<ts>.files/`.
      responses:
        "200":
          description: SQLite file
          content:
            application/vnd.sqlite3:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteBackup
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/backups:restore:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: restoreBackup
      description: Creates a new app from a backup. The source app is untouched. In-place restore is not available yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [backup, newApp]
              properties:
                backup: { type: string }
                newApp: { $ref: "#/components/schemas/Name" }
      responses:
        "201":
          description: New app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/api-keys:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listApiKeys
      description: API keys of the app, newest first (superuser). Secrets are never returned.
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createApiKey
      description: |
        Creates a key. The secret is returned once, as `key`. Send it as `Authorization: Bearer mk_...`.
        A key works only on its own app. `records:admin` bypasses collection rules; every other
        key is anonymous to the rules, narrowed by its scopes (`@request.key.*` is not available yet).
        Scopes: `records:read[:collection]`, `records:write[:collection]`, `records:admin`,
        `realtime:subscribe` (also needs `records:read` per collection), `files:read[:bucket]`,
        `files:write[:bucket]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                scopes: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
                expiresInDays: { type: integer, minimum: 1, maximum: 3650, description: Omit for no expiry }
                rateLimitPerMin: { type: integer, minimum: 1, maximum: 1000000, description: "Requests per minute, with a burst of the same size. Over it: 429 + Retry-After. Omit for no limit." }
                allowedIps: { type: array, maxItems: 32, items: { type: string }, description: "IPs or CIDR networks the key may be used from (403 elsewhere). Omit for any. Behind a proxy set MONOLITH_TRUST_PROXY=1." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string, description: The secret, shown once }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateApiKey
      description: |
        Replaces name, scopes, expiry (counted from now), rate limit and allowlist. The secret is not
        changed and keeps working; to rotate it create a new key and revoke this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                scopes: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
                expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
                rateLimitPerMin: { type: integer, minimum: 1, maximum: 1000000 }
                allowedIps: { type: array, maxItems: 32, items: { type: string } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: revokeApiKey
      description: Revokes the key; it stops working on the next request.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/webhooks:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listWebhooks
      description: Webhooks of the app (superuser). Secrets are never returned.
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWebhook
      description: |
        Creates a webhook (at most 20 per app). Each matching record change after commit is POSTed to `url`
        as JSON with headers `X-Monolith-Event`, `X-Monolith-Delivery` and
        `X-Monolith-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" with the secret>`.
        2xx = delivered; anything else retries with backoff (5 s doubling, capped at 1 h) up to 10 attempts,
        then the delivery is `dead` (retry it by hand). Delivery is at least once and may be out of order
        after retries: de-duplicate on the delivery id, order by `seq`. Hidden fields are never sent.
        The signing secret is returned once, as `secret`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Webhook"
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string, description: The signing secret, shown once }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateWebhook
      description: Replaces name, URL, events and the enabled flag. The secret stays.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookIn" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWebhook
      description: Deletes the webhook and its delivery log.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/webhooks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: testWebhook
      description: Queues a `ping` delivery (event `ping`, empty record) to check the receiver end to end.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listWebhookDeliveries
      description: Delivery log of one webhook, newest first. Finished rows are kept 7 days, dead ones 28.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, ok, dead] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/webhooks/{id}/deliveries/{did}/retry:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: did
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryWebhookDelivery
      description: Puts a delivery back in the queue with a fresh run of attempts.
      responses:
        "202": { description: Queued }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/plugins:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listPlugins
      description: WASM plugins of the app (superuser).
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Plugin" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlugin
      description: |
        Installs a plugin. The body is the raw WebAssembly module (`application/wasm`, at most 8 MiB).
        It must export `memory`, `alloc(i32) -> i32` and `on_event(i32, i32) -> i32` and may import only
        `monolith.log(i32, i32, i32)`. After each matching record change (same envelope as webhooks) the host
        calls `on_event(ptr, len)`; a non-zero result is an error. Each call runs on a fresh instance with a fuel
        budget and 16 MiB of memory. At most once, no retries. At most 20 plugins per app.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 100 } }
        - { name: events, in: query, required: true, schema: { type: string, example: "orders.create,orders.update" }, description: Comma-separated `collection.op` patterns }
        - { name: fuel, in: query, required: false, schema: { type: integer, minimum: 1000, maximum: 5000000000 }, description: Instruction budget per call (default 50 million) }
        - { name: enabled, in: query, required: false, schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          application/wasm:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/plugins/{id}:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updatePlugin
      description: Changes name, events, enabled flag and fuel. The module stays; upload a new plugin to replace it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, events]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                events: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
                enabled: { type: boolean, default: true }
                fuel: { type: integer, minimum: 1000, maximum: 5000000000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePlugin
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/plugins/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: pluginLogs
      description: The latest 100 lines the plugin wrote with `monolith.log` (memory only, reset on restart), oldest first.
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/storage/config:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: getStorageConfig
      description: Where this app's file bytes live (superuser). The secret access key is never returned.
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageConfig" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putStorageConfig
      description: |
        Chooses `local` disk or an S3-compatible bucket for blob bytes (metadata and thumbnails stay on
        local disk). An S3 config is checked first by writing, reading and deleting a probe object, so a
        wrong key, region or endpoint is a 400 now rather than a failed upload later. Blobs are not
        moved between backends: once the app holds files the location cannot change (409), only the
        credentials. Omit `secretAccessKey` to keep the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageConfigInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageConfig" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/storage:gc:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: collectStorageGarbage
      description: |
        Deletes blob files that no object references (older than ten minutes) and reports referenced
        blobs whose file is missing. Runs once in the background when an app's storage is first used.
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  removedFiles: { type: integer }
                  removedThumbDirs: { type: integer }
                  removedBytes: { type: integer }
                  missingFiles: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/buckets:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listBuckets
      description: Storage buckets with object counts and bytes (superuser).
      responses:
        "200":
          description: Buckets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createBucket
      description: Creates a bucket (superuser).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bucket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/buckets/{bucket}:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Bucket"
    get:
      operationId: getBucket
      responses:
        "200":
          description: Bucket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bucket" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: replaceBucket
      description: Replaces the bucket config. `name` must match the path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bucket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteBucket
      description: Fails with 409 when the bucket has objects, unless `force=true`, which deletes them too.
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/buckets/{bucket}/objects:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Bucket"
    get:
      operationId: listObjects
      description: |
        Objects ordered by key, keyset paged. Needs a superuser token or a key with `files:read`
        (also for public buckets: public means readable by key, not listable).
      parameters:
        - { name: prefix, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: cursor, in: query, description: "`nextCursor` of the previous page", schema: { type: string } }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StorageObject" } }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/buckets/{bucket}/objects/{key}:
    parameters:
      - $ref: "#/components/parameters/App"
      - $ref: "#/components/parameters/Bucket"
      - name: key
        in: path
        required: true
        description: 1 to 512 bytes; may contain `/`; no empty, `.` or `..` segments, control characters or backslashes.
        schema: { type: string }
    get:
      operationId: getObject
      parameters:
        - name: thumb
          in: query
          description: "A size from the bucket's `thumbSizes`; returns a JPEG (PNG when the source has transparency) thumbnail of a png, jpeg, gif or webp object, made on demand and cached. 400 for other sizes or non-images, 413 for sources over 50 megapixels."
          schema: { type: string, example: "100x100" }
      description: |
        Streams the object. Anonymous in a public bucket, otherwise a superuser token or a key with
        `files:read`. Supports `ETag`/`If-None-Match` and a single `Range`. Served with `nosniff` and
        a sandbox CSP; only images (not SVG), audio, video, PDF and plain text display inline.
      responses:
        "200": { description: Content, content: { "*/*": { schema: { type: string, format: binary } } } }
        "206": { description: Partial content }
        "304": { description: Not modified }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "416": { description: Range not satisfiable }
    put:
      operationId: putObject
      description: |
        Uploads the raw request body (not multipart) and replaces any object with that key. Needs a
        superuser token or a key with `files:write`. `Content-Type` is stored and checked against the
        bucket's `allowedMime`. The body is streamed; the bucket's `maxSize` is enforced as it arrives and `maxBytes` (quota) at commit. Identical content is stored once.
      requestBody:
        required: true
        content:
          "*/*": { schema: { type: string, format: binary } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/StorageObject" } } } }
        "200": { description: Replaced, content: { application/json: { schema: { $ref: "#/components/schemas/StorageObject" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteObject
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/providers:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: authProviders
      description: |
        Public. The sign-in methods this app offers, for building a sign-in screen: email and password
        (with whether sign-up is open) and every enabled OAuth/OIDC provider that works. Nothing secret.
      responses:
        "200":
          description: Methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAuth" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/register:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: authRegister
      description: Creates an email and password account and signs it in. 403 when sign-up or the method is off, 409 when the email is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72, description: "At least the app's minPasswordLength" }
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/login:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: authLogin
      description: Signs in with email and password. Wrong email, wrong password and a disabled account all answer 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/refresh:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: authRefresh
      description: Trades a refresh token for a new access and refresh token. The old refresh token stops working at once (rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/logout:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: authLogout
      description: Ends the session of a refresh token. Unknown tokens are not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: Signed out }

  /api/v1/apps/{app}/auth/me:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: authMe
      description: The signed-in app user (needs a user access token; superusers and keys get 401).
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: authUpdateMe
      description: Changes the display name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/password:
    parameters:
      - $ref: "#/components/parameters/App"
    post:
      operationId: authChangePassword
      description: Changes the password (needs the old one) and ends every session of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/oauth/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: provider
        in: path
        required: true
        schema: { type: string, example: google }
      - name: redirectUri
        in: query
        required: true
        schema: { type: string }
        description: Where to send the browser when done. Must match the app's `allowedRedirects`.
    get:
      operationId: oauthStart
      description: |
        Starts an OAuth sign-in (authorization code with PKCE): 302 to the provider. When the user is done,
        the provider returns to `/auth/oauth/{provider}/callback`, which 302s to `redirectUri` with the
        session in the URL fragment: `#token=…&refreshToken=…&expiresAt=…`, or `#error=oauth_failed&error_description=…`.
        Register `<public origin>/api/v1/apps/{app}/auth/oauth/{provider}/callback` at the provider.
        Set `MONOLITH_PUBLIC_URL` when the server sits behind a proxy.
      responses:
        "302": { description: Redirect to the provider }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: provider
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: oauthCallback
      description: The provider's return URL (not called by clients). 302 to the app's redirect with the session or an error in the fragment.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect back to the app }
        "400": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/users:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: listUsers
      description: App users, oldest first (superuser). Pass `next` as `after` for the following page.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AppUser" } }
                  next: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createUser
      description: Creates an email and password user without signing in (superuser).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/users/{id}:
    parameters:
      - $ref: "#/components/parameters/App"
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateUser
      description: Changes name, disabled flag or password (superuser). Disabling or a new password ends the user's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                disabled: { type: boolean }
                password: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/apps/{app}/auth/config:
    parameters:
      - $ref: "#/components/parameters/App"
    get:
      operationId: getAuthConfig
      description: |
        Sign-in configuration of one app (superuser): email/password settings and the connected
        OAuth providers, plus the `catalog` of providers the server can connect. Client secrets
        are never returned, only `clientSecretSet`. Configuration only for now: sign-in itself
        arrives with Phase 2 auth.
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putAuthConfig
      description: |
        Replaces the configuration. A provider missing from `providers` is removed. In a provider,
        an omitted `clientSecret` keeps the stored secret and an empty string clears it. Enabling a
        provider needs `clientId`, a secret and its required `extra` fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthConfigInput" }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Superuser token from /api/v1/system/auth/login, or an app-bound API key (`mk_...`, see
        `/api/v1/apps/{app}/api-keys`) on that app's record and realtime routes. User tokens arrive in Phase 2.

  parameters:
    Bucket:
      name: bucket
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
    App:
      name: app
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    Collection:
      name: collection
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    DryRun:
      name: dry_run
      in: query
      schema: { type: boolean, default: false }
      description: Validate and run inside a rolled-back savepoint without committing changes.

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "../jsonschema/error.json" }

  schemas:
    Superuser:
      type: object
      required: [id, email, created]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { type: string, format: email }
        created: { type: string, format: date-time }
    Id:
      type: string
      pattern: "^[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$"
    Name:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,62}$"
      description: Lowercase identifier. Names starting with `_` are reserved.

    App:
      type: object
      required: [name, created]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        created: { type: string, format: date-time }

    Field:
      type: object
      required: [name, type]
      properties:
        name:
          allOf: [{ $ref: "#/components/schemas/Name" }]
          not: { enum: [id, created, updated] }
        type: { type: string, enum: [text, email, url, number, bool, date, select, relation, json] }
        required: { type: boolean, default: false }
        hidden: { type: boolean, default: false, description: Superuser-only; never returned to other callers }
        min: { type: number, description: "text: min length; number: min value" }
        max: { type: number, description: "text: max length (default 65536); number: max value" }
        onlyInt: { type: boolean, default: false, description: number fields only }
        values:
          type: array
          items: { type: string }
          description: select fields only; allowed values
        collection: { $ref: "#/components/schemas/Name", description: relation fields only; target collection }
        onDelete: { type: string, enum: [restrict, cascade, setNull], default: restrict, description: relation fields only }
        maxSelect: { type: integer, minimum: 1, default: 1, description: "relation fields only; > 1 makes it a multi-relation backed by a _rel_<collection>_<field> junction table" }

    Rules:
      type: object
      description: Each rule is null (superusers only), "" (anyone) or an expression.
      properties:
        list: { type: [string, "null"], default: null }
        view: { type: [string, "null"], default: null }
        create: { type: [string, "null"], default: null }
        update: { type: [string, "null"], default: null }
        delete: { type: [string, "null"], default: null }

    Index:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          items: { type: string }
        unique: { type: boolean, default: false }

    CollectionInput:
      type: object
      required: [name, fields]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        type: { type: string, enum: [base], default: base }
        fields:
          type: array
          maxItems: 61
          items: { $ref: "#/components/schemas/Field" }
        rules: { $ref: "#/components/schemas/Rules" }
        indexes:
          type: array
          items: { $ref: "#/components/schemas/Index" }

    Collection:
      allOf:
        - $ref: "#/components/schemas/CollectionInput"
        - type: object
          required: [version]
          properties:
            version: { type: integer, description: Increments on every schema change }

    Record:
      type: object
      required: [id, created, updated, _v]
      additionalProperties: true
      properties:
        id: { $ref: "#/components/schemas/Id" }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        _v: { type: integer, description: seq of the last change to this record }
        expand:
          type: object
          additionalProperties:
            oneOf:
              - { $ref: "#/components/schemas/Record" }
              - type: array
                items: { $ref: "#/components/schemas/Record" }

    RecordInput:
      type: object
      additionalProperties: true
      description: Field values. `id` may be set on create (client-generated UUIDv7); system fields are otherwise read-only.

    RequestLog:
      type: object
      required: [requestId, timestamp, method, path, status, durationUs, superuser]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        durationUs: { type: integer }
        superuser: { type: boolean }
        error: { type: [string, "null"] }

    Traffic:
      type: object
      description: |
        Request counters. `reads`/`writes` count record API requests (GET vs. other methods,
        batch included). `creates`/`updates`/`deletes` count committed record changes from
        the change bus (one batch request can make many). Latency percentiles are
        approximate (log2 histogram bucket upper bound).
      required: [requests, reads, writes, creates, updates, deletes, errors4xx, errors5xx, bytesIn, bytesOut, avgUs, maxUs, p50Us, p95Us, p99Us]
      properties:
        requests: { type: integer }
        reads: { type: integer }
        writes: { type: integer }
        creates: { type: integer }
        updates: { type: integer }
        deletes: { type: integer }
        errors4xx: { type: integer }
        errors5xx: { type: integer }
        bytesIn: { type: integer }
        bytesOut: { type: integer }
        avgUs: { type: integer }
        maxUs: { type: integer }
        p50Us: { type: integer }
        p95Us: { type: integer }
        p99Us: { type: integer }

    TrafficPoint:
      allOf:
        - $ref: "#/components/schemas/Traffic"
        - type: object
          required: [t]
          properties:
            t: { type: integer, description: Bucket start, unix seconds }

    TrafficSeries:
      type: object
      required: [total, lastHour, minutes, hours]
      properties:
        total: { $ref: "#/components/schemas/Traffic" }
        lastHour: { $ref: "#/components/schemas/Traffic" }
        minutes:
          type: array
          description: 60 per-minute buckets, oldest first
          items: { $ref: "#/components/schemas/TrafficPoint" }
        hours:
          type: array
          description: 48 per-hour buckets, oldest first
          items: { $ref: "#/components/schemas/TrafficPoint" }

    SystemStats:
      type: object
      required: [since, uptimeS, memoryBytes, appsTotal, appsLoaded, traffic, apps]
      properties:
        since: { type: string, format: date-time }
        uptimeS: { type: integer }
        memoryBytes: { type: [integer, "null"], description: Resident set size; null where unsupported }
        appsTotal: { type: integer }
        appsLoaded: { type: integer }
        traffic: { $ref: "#/components/schemas/TrafficSeries" }
        apps:
          type: array
          items:
            type: object
            required: [name, loaded, dbBytes, walBytes, traffic]
            properties:
              name: { $ref: "#/components/schemas/Name" }
              loaded: { type: boolean }
              dbBytes: { type: integer }
              walBytes: { type: integer }
              traffic:
                description: Totals since start; null while the app is not loaded
                oneOf: [{ $ref: "#/components/schemas/Traffic" }, { type: "null" }]

    StoreStats:
      type: object
      description: Engine internals since the app was opened.
      required: [commits, ops, opsFailed, mutations, maxBatch, commitAvgUs, commitMaxUs, reads, readAvgUs, busy, writerQueue, readerQueue, readers]
      properties:
        commits: { type: integer, description: Group-commit transactions }
        ops: { type: integer, description: Write ops (requests) handled by the writer }
        opsFailed: { type: integer }
        mutations: { type: integer, description: Committed row changes (seq values) }
        maxBatch: { type: integer, description: Largest group commit seen }
        commitAvgUs: { type: integer }
        commitMaxUs: { type: integer }
        reads: { type: integer, description: Read jobs run on the reader pool }
        readAvgUs: { type: integer }
        busy: { type: integer, description: Requests rejected because a queue was full (503) }
        writerQueue: { type: integer, description: Current writer queue depth }
        readerQueue: { type: integer, description: Current reader queue depth }
        readers: { type: integer }

    Backup:
      type: object
      required: [name, bytes, created]
      properties:
        name: { type: string, example: b20261107134512123.db }
        bytes: { type: integer, description: Size of the database file (storage is not included) }
        created: { type: string, format: date-time }
        files: { type: boolean, description: "The backup also holds the app's storage buckets: a files.db snapshot plus hard links to the blobs, in b<ts>.files/ next to the database file" }

    StorageConfigInput:
      type: object
      additionalProperties: false
      required: [backend]
      properties:
        backend: { type: string, enum: [local, s3] }
        s3:
          type: object
          additionalProperties: false
          required: [bucket, accessKeyId]
          properties:
            bucket: { type: string }
            region: { type: string, default: us-east-1 }
            endpoint: { type: string, description: "For S3-compatible services (MinIO, R2, B2, Wasabi); omit for AWS" }
            prefix: { type: string, description: Key prefix inside the bucket }
            accessKeyId: { type: string }
            secretAccessKey: { type: string, description: Omit to keep the stored secret }
            allowHttp: { type: boolean, default: false }
            pathStyle: { type: boolean, default: false, description: "https://host/bucket/key addressing; most self-hosted services need it" }

    StorageConfig:
      type: object
      required: [backend]
      properties:
        backend: { type: string, enum: [local, s3] }
        s3:
          type: [object, "null"]
          properties:
            bucket: { type: string }
            region: { type: string }
            endpoint: { type: [string, "null"] }
            prefix: { type: string }
            accessKeyId: { type: string }
            secretAccessKeySet: { type: boolean }
            allowHttp: { type: boolean }
            pathStyle: { type: boolean }

    BucketInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        public: { type: boolean, default: false }
        maxSize: { type: integer, minimum: 1, maximum: 10737418240, default: 104857600, description: Bytes per object }
        allowedMime: { type: array, maxItems: 32, items: { type: string }, description: "e.g. image/png, image/*; empty allows all. Checked against the type detected from the content when there is one, else the declared type." }
        maxBytes: { type: integer, minimum: 1, description: "Total bytes the bucket may hold, counted per object before dedupe (413 when exceeded). Omit for no limit." }
        thumbSizes: { type: array, maxItems: 16, items: { type: string, example: "100x100" }, description: "Sizes `?thumb=` may request: WxH crops to fill, Wx0 / 0xH keep the aspect ratio, WxHf fits inside (sides up to 4096). Only these are generated." }

    Bucket:
      type: object
      required: [name, public, maxSize, allowedMime, created, objects, bytes]
      properties:
        name: { type: string }
        public: { type: boolean }
        maxSize: { type: integer }
        allowedMime: { type: array, items: { type: string } }
        maxBytes: { type: [integer, "null"] }
        thumbSizes: { type: array, items: { type: string } }
        created: { type: string, format: date-time }
        objects: { type: integer }
        bytes: { type: integer }

    StorageObject:
      type: object
      required: [key, size, mime, etag, created, updated]
      properties:
        key: { type: string }
        size: { type: integer }
        mime: { type: string }
        etag: { type: string, description: BLAKE3 of the content, hex }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }

    AppUser:
      type: object
      required: [id, name, created, disabled, providers]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        name: { type: string }
        created: { type: string, format: date-time }
        disabled: { type: boolean }
        lastLogin: { type: [string, "null"], format: date-time }
        providers: { type: array, items: { type: string }, description: "`password` and linked provider ids" }
    Session:
      type: object
      required: [token, refreshToken, expiresAt, user]
      properties:
        token: { type: string, description: "Access token, sent as `Authorization: Bearer`; valid 15 minutes" }
        refreshToken: { type: string, description: Valid 30 days, single use }
        expiresAt: { type: string, format: date-time, description: When the access token expires }
        user: { $ref: "#/components/schemas/AppUser" }
    PublicAuth:
      type: object
      required: [app, emailPassword, providers]
      properties:
        app: { type: string }
        emailPassword:
          type: object
          required: [enabled, allowSignup, minPasswordLength]
          properties:
            enabled: { type: boolean }
            allowSignup: { type: boolean }
            minPasswordLength: { type: integer }
        providers:
          type: array
          items:
            type: object
            required: [id, name, startPath]
            properties:
              id: { type: string, example: google }
              name: { type: string, example: Google }
              startPath: { type: string, description: "Open it (relative to the server) with `?redirectUri=` to start the sign-in" }
    Plugin:
      type: object
      required: [id, name, events, enabled, created, size, fuel, calls, errors]
      properties:
        id: { type: string }
        name: { type: string }
        events: { type: array, items: { type: string } }
        enabled: { type: boolean }
        created: { type: string, format: date-time }
        size: { type: integer, description: Module size in bytes }
        fuel: { type: integer }
        calls: { type: integer, description: Calls since the server started }
        errors: { type: integer, description: Failed calls since the server started }
        lastError: { type: [string, "null"] }
        lastRun: { type: [string, "null"], format: date-time }
    WebhookIn:
      type: object
      additionalProperties: false
      required: [name, url, events]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, maxLength: 2048, description: An http(s) URL }
        events:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, example: "posts.create" }
          description: "`collection.op` patterns: `posts.create`, `posts.*`, `*.delete`, `*`. Ops: create, update, delete."
        enabled: { type: boolean, default: true }
    Webhook:
      type: object
      required: [id, name, url, events, enabled, created, secretHint, pending, dead]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string } }
        enabled: { type: boolean }
        created: { type: string, format: date-time }
        secretHint: { type: string, description: First 12 characters of the signing secret }
        pending: { type: integer, description: Deliveries waiting or retrying }
        dead: { type: integer, description: Deliveries that ran out of attempts }
    WebhookDelivery:
      type: object
      required: [id, event, seq, status, attempts, created]
      properties:
        id: { type: string }
        event: { type: string, example: "posts.create" }
        seq: { type: integer }
        status: { type: string, enum: [pending, ok, dead] }
        attempts: { type: integer }
        nextAttempt: { type: [string, "null"], format: date-time }
        lastStatus: { type: [integer, "null"], description: HTTP status of the last attempt }
        lastError: { type: [string, "null"] }
        created: { type: string, format: date-time }
    ApiKey:
      type: object
      required: [id, app, name, prefix, scopes, created]
      properties:
        id: { type: string }
        app: { type: string }
        name: { type: string }
        prefix: { type: string, description: First 12 characters of the secret, to recognise it }
        scopes: { type: array, items: { type: string } }
        created: { type: string, format: date-time }
        expires: { type: [string, "null"], format: date-time }
        lastUsed: { type: [string, "null"], format: date-time, description: Kept in memory, saved about once a minute }
        rateLimitPerMin: { type: [integer, "null"] }
        allowedIps: { type: array, items: { type: string } }

    EmailPasswordConfig:
      type: object
      properties:
        enabled: { type: boolean, default: true }
        allowSignup: { type: boolean, default: true }
        minPasswordLength: { type: integer, minimum: 8, maximum: 72, default: 8 }

    AuthProviderDef:
      type: object
      required: [id, name, fields, required]
      properties:
        id: { type: string, example: google }
        name: { type: string, example: Google }
        fields: { type: array, items: { type: string }, description: Provider-specific extra settings }
        required: { type: array, items: { type: string }, description: Extra settings needed to enable it }

    AuthProvider:
      type: object
      required: [id, name, enabled, clientId, clientSecretSet, extra, callbackPath]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        clientId: { type: string }
        clientSecretSet: { type: boolean }
        extra: { type: object, additionalProperties: { type: string } }
        callbackPath: { type: string, description: Register this path on your public origin as the OAuth redirect URI }

    AuthConfig:
      type: object
      required: [emailPassword, providers, allowedRedirects, catalog]
      properties:
        emailPassword: { $ref: "#/components/schemas/EmailPasswordConfig" }
        providers: { type: array, items: { $ref: "#/components/schemas/AuthProvider" } }
        allowedRedirects: { type: array, items: { type: string }, description: URLs OAuth may send the browser back to (exact, or a prefix ending in `*`) }
        catalog: { type: array, items: { $ref: "#/components/schemas/AuthProviderDef" } }

    AuthProviderInput:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        enabled: { type: boolean, default: false }
        clientId: { type: string, maxLength: 256 }
        clientSecret: { type: string, maxLength: 2048, description: Write-only. Omit to keep the stored secret. }
        extra: { type: object, additionalProperties: { type: string } }

    AuthConfigInput:
      type: object
      additionalProperties: false
      properties:
        emailPassword: { $ref: "#/components/schemas/EmailPasswordConfig" }
        providers: { type: array, items: { $ref: "#/components/schemas/AuthProviderInput" } }
        allowedRedirects: { type: array, maxItems: 20, items: { type: string, maxLength: 256 } }

    AppStats:
      type: object
      required: [app, since, schemaVersion, traffic, store, dbBytes, walBytes, collections, realtime]
      properties:
        realtime:
          type: object
          required: [connections, events, dropped]
          properties:
            connections: { type: integer, description: Open realtime subscriptions }
            events: { type: integer, description: Frames queued since the app loaded }
            dropped: { type: integer, description: Connections dropped for a full queue }
        app: { $ref: "#/components/schemas/Name" }
        since: { type: string, format: date-time, description: When the app was loaded }
        schemaVersion: { type: integer }
        traffic: { $ref: "#/components/schemas/TrafficSeries" }
        store: { $ref: "#/components/schemas/StoreStats" }
        dbBytes: { type: integer }
        walBytes: { type: integer }
        collections:
          type: array
          items:
            type: object
            required: [name, records, reads, creates, updates, deletes]
            properties:
              name: { $ref: "#/components/schemas/Name" }
              records: { type: [integer, "null"] }
              reads: { type: integer }
              creates: { type: integer }
              updates: { type: integer }
              deletes: { type: integer }
